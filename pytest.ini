[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
xfail_strict = true
filterwarnings =
    default
markers =
    unit: isolated deterministic unit tests
    integration: opt-in integration tests that may use an OS service but never MT5
    characterization: tests that pin current externally visible behavior
    known_defect: executable specification for intentionally unfixed behavior
    slow: deterministic tests with a comparatively long runtime
    windows: tests specific to Windows behavior
